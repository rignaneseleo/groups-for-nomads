name: WhatsApp Invite Validation

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply offline removals and name fixes to data.yaml (manual use)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 2 * * 1"
  pull_request:
    paths:
      - "data.yaml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  whatsapp-invite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RUN_WHATSAPP_LINK_TESTS: "1"
      WHATSAPP_LINK_TEST_WORKERS: "1"
      WHATSAPP_LINK_DELAY_MS: "1200"
      WHATSAPP_LINK_JITTER_MS: "900"
      WHATSAPP_LINK_MAX_RETRIES: "2"
      WHATSAPP_LINK_RETRY_BACKOFF_MS: "2000"
      # WhatsApp rate-limits after about 52 invite fetches per IP.
      # The window resets after about 255 s, so wait 300 s and retry.
      WHATSAPP_RATE_LIMIT_WAIT_S: "300"
      WHATSAPP_RATE_LIMIT_MAX_WAITS: "12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract PR WhatsApp links
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff "origin/${{ github.base_ref }}...HEAD" -- data.yaml \
            | grep '^+' \
            | grep -v '^+++' \
            | grep -oE 'https://chat\.whatsapp\.com/[A-Za-z0-9]+' \
            | sort -u > pr_whatsapp_urls.txt || true

          count=$(wc -l < pr_whatsapp_urls.txt | tr -d ' ')
          echo "Found $count PR WhatsApp links to check"
          if [ "$count" -eq 0 ]; then
            echo "No new WhatsApp links in this PR."
          fi

      - name: Run WhatsApp invite checks
        id: whatsapp_check
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          set -o pipefail
          APPLY_FLAG=""
          URLS_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply_changes }}" = "true" ]; then
            APPLY_FLAG="--apply"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            URLS_ARG="--urls-file pr_whatsapp_urls.txt"
          fi
          python scripts/check_whatsapp_invites.py \
            --data-file data.yaml \
            --delay-ms "$WHATSAPP_LINK_DELAY_MS" \
            --jitter-ms "$WHATSAPP_LINK_JITTER_MS" \
            --retries "$WHATSAPP_LINK_MAX_RETRIES" \
            --rate-limit-wait-s "$WHATSAPP_RATE_LIMIT_WAIT_S" \
            --rate-limit-max-waits "$WHATSAPP_RATE_LIMIT_MAX_WAITS" \
            --report-file whatsapp_invite_report.json \
            $URLS_ARG \
            $APPLY_FLAG 2>&1 | tee whatsapp_invite_check.log

      - name: Upload WhatsApp check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-invite-check-log
          path: whatsapp_invite_check.log

      - name: Upload WhatsApp check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-invite-check-report
          path: whatsapp_invite_report.json
          if-no-files-found: warn

      - name: Build PR mismatch review payload
        if: always() && github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          log_path = Path("whatsapp_invite_check.log")
          payload_path = Path("whatsapp_pr_mismatch_payload.json")
          data_path = Path("data.yaml")

          mismatches = []
          for raw_line in log_path.read_text(encoding="utf-8", errors="replace").splitlines():
              line = raw_line.strip()
              if not line.startswith("MISMATCH_JSON "):
                  continue
              try:
                  payload = json.loads(line.split("MISMATCH_JSON ", 1)[1])
              except Exception:
                  continue
              if not isinstance(payload, dict):
                  continue
              if not str(payload.get("url", "")).startswith("https://chat.whatsapp.com/"):
                  continue
              mismatches.append(
                  {
                      "current_name": str(payload.get("current_name", "")),
                      "live_name": str(payload.get("live_name", "")),
                      "url": str(payload.get("url", "")),
                  }
              )

          url_line_map = {}
          for idx, raw_line in enumerate(data_path.read_text(encoding="utf-8").splitlines(), start=1):
              stripped = raw_line.strip()
              if stripped.startswith("url: https://chat.whatsapp.com/"):
                  url_line_map[stripped.split("url: ", 1)[1]] = idx

          review_comments = []
          for mismatch in mismatches:
              url = mismatch["url"]
              line = url_line_map.get(url)
              if not line:
                  continue
              review_comments.append(
                  {
                      "line": line,
                      "body": (
                          "<!-- whatsapp-name-mismatch -->\n"
                          "WhatsApp invite page name differs from `data.yaml`.\n\n"
                          f"- Current: `{mismatch['current_name']}`\n"
                          f"- Live: `{mismatch['live_name']}`\n\n"
                          "Please resolve (rename) or discard (keep as-is) with justification."
                      ),
                  }
              )

          payload_path.write_text(json.dumps(review_comments), encoding="utf-8")
          print(f"review_comment_count={len(review_comments)}")

          with Path(".github_output_tmp").open("w", encoding="utf-8") as out:
              out.write(f"review_comment_count={len(review_comments)}\n")
          PY
          cat .github_output_tmp >> "$GITHUB_OUTPUT"

      - name: Post PR review comments for mismatches
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = "whatsapp_pr_mismatch_payload.json";
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;
            const marker = "<!-- whatsapp-name-mismatch -->";

            if (!fs.existsSync(path)) {
              core.info("No mismatch payload file found.");
              return;
            }

            const comments = JSON.parse(fs.readFileSync(path, "utf8"));

            const existing = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              per_page: 100,
            });

            for (const c of existing) {
              if (c.user?.login === "github-actions[bot]" && c.body?.includes(marker)) {
                await github.rest.pulls.deleteReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            if (!comments.length) {
              core.info("No mismatch review comments to post.");
              return;
            }

            for (const c of comments) {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                commit_id,
                path: "data.yaml",
                line: c.line,
                side: "RIGHT",
                body: c.body,
              });
            }

      - name: Upload updated data.yaml (manual apply mode)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.apply_changes == true
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-data-yaml-updated
          path: data.yaml

      - name: Sync offline-groups issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA: "${{ github.sha }}"
        with:
          script: |
            const fs = require("fs");

            const runUrl = process.env.RUN_URL;
            const commitSha = process.env.COMMIT_SHA;
            const reportPath = "whatsapp_invite_report.json";
            const titlePrefix = "WhatsApp groups offline";
            const trackingLabel = "whatsapp-check";

            let report = { checked: 0, offline: [], inconclusive: [], mismatches: [] };
            if (fs.existsSync(reportPath)) {
              try {
                report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              } catch (err) {
                core.warning(`Could not parse ${reportPath}: ${err}`);
              }
            } else {
              core.warning(`${reportPath} not found. Treating the report as empty.`);
            }

            const offline = Array.isArray(report.offline) ? report.offline : [];
            const inconclusive = Array.isArray(report.inconclusive) ? report.inconclusive : [];
            const mismatches = Array.isArray(report.mismatches) ? report.mismatches : [];
            const checked = Number(report.checked || 0);

            const lines = [];
            lines.push(`## ${titlePrefix}`);
            lines.push("");
            lines.push(`- Run: ${runUrl}`);
            lines.push(`- Commit: ${commitSha}`);
            lines.push("");
            lines.push("| Result | Count |");
            lines.push("| --- | --- |");
            lines.push(`| Checked | ${checked} |`);
            lines.push(`| Offline | ${offline.length} |`);
            lines.push(`| Inconclusive | ${inconclusive.length} |`);
            lines.push(`| Name mismatches | ${mismatches.length} |`);
            lines.push("");

            if (offline.length) {
              lines.push("### Offline groups");
              lines.push("");
              for (const item of offline) {
                lines.push(`- **${item.name}** — ${item.url} — ${item.reason}`);
              }
              lines.push("");
            } else {
              lines.push("No offline groups in this run.");
              lines.push("");
            }

            if (inconclusive.length) {
              lines.push("<details>");
              lines.push(`<summary>Inconclusive groups (${inconclusive.length}) — state unknown, nothing removed</summary>`);
              lines.push("");
              for (const item of inconclusive) {
                lines.push(`- **${item.name}** — ${item.url} — ${item.reason}`);
              }
              lines.push("");
              lines.push("</details>");
              lines.push("");
            }

            const body = lines.join("\n");

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: trackingLabel,
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title.startsWith(titlePrefix));

            if (offline.length > 0) {
              const title = `${titlePrefix} (${offline.length})`;
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                });
                core.info(`Updated issue #${existing.number}.`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [trackingLabel, "broken-links"],
                });
                core.info(`Created issue #${created.data.number}.`);
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `All WhatsApp links are active again as of ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
              core.info(`Closed issue #${existing.number}.`);
            } else {
              core.info("No offline groups and no open tracking issue. Nothing to do.");
            }

      - name: Fail strict run
        if: always() && github.event_name != 'pull_request' && steps.whatsapp_check.outcome == 'failure'
        run: exit 1
